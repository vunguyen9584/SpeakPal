# SpeakPal Redis Configuration

# Memory settings
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
appendonly yes
appendfsync everysec

# Disable dangerous commands in production
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""

# Logging
loglevel notice

# TCP keepalive
tcp-keepalive 300
