name: Flutter Analyze
on:
  push:
    branches: [main, develop]
    paths:
      - "mobile/**"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"

jobs:
  analyze:
    name: Critical Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"
          cache: true

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Analyze
        working-directory: mobile
        run: |
          flutter analyze --no-pub > analyze_report.txt 2>&1 || true
          cat analyze_report.txt

      - name: Check for Errors
        working-directory: mobile
        run: |
          ERROR_COUNT=$(grep -c "error •" analyze_report.txt || echo 0)
          WARNING_COUNT=$(grep -c "warning •" analyze_report.txt || echo 0)
          echo "ERRORS=$ERROR_COUNT" >> $GITHUB_ENV
          echo "WARNINGS=$WARNING_COUNT" >> $GITHUB_ENV

          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "❌ Found $ERROR_COUNT critical errors in Flutter analysis."
            exit 1
          else
            echo "✅ No critical errors found. Warnings: $WARNING_COUNT"
          fi
